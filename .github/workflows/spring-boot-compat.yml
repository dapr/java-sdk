name: Spring Boot compatibility

# Runs the integration tests against every supported Spring Boot line, the way an application
# sees the SDK: compiled against the baseline in pom.xml, run with a newer Spring Boot, and with
# the Jackson, Netty and OpenTelemetry versions that Spring Boot manages instead of the SDK's pins.
# Weekly instead of on every pull request to keep runner usage down. merge-checker.yml shows the
# result of the latest run on every pull request.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  compat:
    name: "Compat jdk:${{ matrix.java }} sb:${{ matrix.spring-boot-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 25 ]
        spring-boot-version: [ 4.1.3, 4.2.0 ]
    steps:
    - uses: actions/checkout@v7
    - name: Set up OpenJDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
    - name: Install sdk
      run: ./mvnw clean install -B -q -DskipTests
    - name: Read versions managed by Spring Boot ${{ matrix.spring-boot-version }}
      id: managed
      run: |
        pom=$(curl -sSfL "https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-dependencies/${{ matrix.spring-boot-version }}/spring-boot-dependencies-${{ matrix.spring-boot-version }}.pom")
        prop() { echo "$pom" | sed -n "s:.*<$1>\(.*\)</$1>.*:\1:p"; }
        echo "args=-Djackson.version=$(prop jackson-2-bom.version) -Djackson3.version=$(prop jackson-bom.version) -Dnetty.version=$(prop netty.version) -Dopentelemetry.version=$(prop opentelemetry.version)" | tee -a "$GITHUB_OUTPUT"
    - name: Integration tests using Spring Boot ${{ matrix.spring-boot-version }}
      id: integration_tests
      uses: nick-fields/retry@v4
      with:
        max_attempts: 2
        timeout_minutes: 25
        retry_wait_seconds: 15
        command: PRODUCT_SPRING_BOOT_VERSION=${{ matrix.spring-boot-version }} ./mvnw -B -pl !sdk-workflows -Pintegration-tests ${{ steps.managed.outputs.args }} clean dependency:copy-dependencies verify
    - name: Upload test reports on failure
      if: ${{ failure() && steps.integration_tests.conclusion == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: reports-jdk${{ matrix.java }}-sb${{ matrix.spring-boot-version }}
        path: |
          sdk-tests/target/failsafe-reports
          sdk-tests/target/surefire-reports
          spring-boot-sdk-tests/target/failsafe-reports
          spring-boot-sdk-tests/target/surefire-reports
